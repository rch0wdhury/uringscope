# SPDX-License-Identifier: MIT
# Boot the kernel matrix in a VM and run uringscope's full suite on each --
# the portability claim, executed. One CO-RE binary across the matrix; each
# kernel's BTF probe must select the right tracepoint variant (e.g. 6.17's
# cqe-collapsed io_uring_complete) and the fault injection suite must pass.
#
# The kernel list lives in test/kernels.txt so docs and CI cannot drift.
# test/vmtest/run.sh uses virtme-ng (vng) to fetch+boot each kernel under
# KVM and run test/vmtest/guest.sh inside.
name: vmtest
on:
  schedule: [{ cron: "17 4 * * *" }]
  workflow_dispatch:
  pull_request:
    paths: ['bpf/**', 'src/**', 'test/**', 'Makefile']
jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      kernels: ${{ steps.k.outputs.kernels }}
    steps:
      - uses: actions/checkout@v4
      - id: k
        run: |
          ks=$(grep -v '^#' test/kernels.txt | awk 'NF{printf "\"%s\",",$1}' | sed 's/,$//')
          echo "kernels=[$ks]" >> "$GITHUB_OUTPUT"
  vmtest:
    needs: matrix
    runs-on: ubuntu-24.04
    # The 'mainline' row deliberately tracks whatever kernel is newest, so it
    # can break for reasons that have nothing to do with this repo -- most
    # obviously the virtme-ng packaged in the runner image being older than
    # the kernel it is asked to boot. It currently does exactly that: vng
    # downloads a 7.x kernel and exits 255 without printing anything at all
    # (the uploaded log is 13KB of download spinner and nothing else). It
    # stays in the matrix as an early-warning signal and its log is still
    # uploaded, but it must not gate a PR on a pinned kernel. The five pinned
    # rows are blocking and assert everything.
    continue-on-error: ${{ matrix.kernel == 'mainline' }}
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJson(needs.matrix.outputs.kernels) }}
    steps:
      - uses: actions/checkout@v4
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libbpf-dev libelf-dev zlib1g-dev \
            liburing-dev qemu-system-x86 fio virtme-ng busybox-static zstd \
            linux-tools-common linux-tools-generic
      - name: build
        run: make
      - name: run in VM (tier assertion + fault injection scoring)
        env:
          # Keep the raw vng/guest log so a failure can be inspected. run.sh
          # runs on the host, so this survives the VM (unlike anything
          # guest.sh writes, which lands in vng's overlay).
          VMTEST_LOGDIR: vmtest-logs
        run: |
          # run.sh maps the kernel label to its expected tier from
          # test/kernels.txt and fails the job on any scored FAIL or a
          # wrong support tier.
          test/vmtest/run.sh "${{ matrix.kernel }}"
      - name: upload raw VM log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vmtest-log-${{ matrix.kernel }}
          path: vmtest-logs/
          if-no-files-found: ignore
      # The tracepoint prototypes this kernel exposes are printed inline by
      # guest.sh as `VMTEST proto ...` lines in the step above. They used to
      # be uploaded as an artifact, but vng --rw gives the guest an overlay,
      # so a file written under the repo never reaches the host and the
      # upload found nothing on every run.
