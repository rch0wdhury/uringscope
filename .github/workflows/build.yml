# SPDX-License-Identifier: MIT
name: build
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    # Both arches: uringscope's BPF programs are tracepoint-based, but the
    # Makefile still picks a __TARGET_ARCH per uname -m, so arm64 breakage
    # would otherwise only surface at release time.
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't let one arch cancel the other -- when something breaks we want
      # to see whether it broke everywhere or only on arm.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libbpf-dev libelf-dev zlib1g-dev \
            linux-tools-common linux-tools-generic
      - name: build
        run: make CC=${{ matrix.cc }} V=1
      - name: offline doctor unit tests
        run: make CC=${{ matrix.cc }} test-offline
      - name: smoke (load + self-attach on runner kernel)
        run: |
          sudo ./uringscope -d 2 -a || true   # runner kernels vary; report only
          sudo ./uringscope -d 1 -- /bin/true
